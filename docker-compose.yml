services:
  db:
    image: mysql:8
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: newsflow
      MYSQL_USER: newsflow
      MYSQL_PASSWORD: newsflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
        DATABASE_URL: sqlite+aiosqlite:///./newsflow.db
    ports:
      - "8000:8000"

volumes:
  mysql_data:
