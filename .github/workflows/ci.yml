name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Тесты (pytest, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Компиляция
        run: python -m compileall -q app

      # Сетевые тесты (маркер live) исключены в pytest.ini; всё остальное — без сети и ключей.
      - name: pytest
        run: python -m pytest -q --junitxml=pytest-report.xml

      - name: Отчёт pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  mysql-smoke:
    name: Смоук на MySQL 8
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: newsflow
          MYSQL_USER: newsflow
          MYSQL_PASSWORD: newsflow
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql+aiomysql://newsflow:newsflow@127.0.0.1:3306/newsflow?charset=utf8mb4
      DATA_MODE: demo
      LLM_PROVIDER: mock
      TG_PROVIDER: mock
      MAX_PROVIDER: mock
      SEARCH_PROVIDER: mock
      PIPELINE_INLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Seed на MySQL
        run: python -m app.seed --reset

      - name: Запуск и проверка API
        run: |
          python -m uvicorn app.main:app --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/health
          curl -fs -c jar -X POST http://127.0.0.1:8000/api/auth/demo-login > /dev/null
          curl -fs -b jar http://127.0.0.1:8000/api/mode
          curl -fs -b jar "http://127.0.0.1:8000/api/feed" > /dev/null
          curl -fs -b jar http://127.0.0.1:8000/api/stories > /dev/null
          for page in / /stories /sources /stats; do
            curl -fs -o /dev/null -b jar "http://127.0.0.1:8000${page}" || { echo "Страница ${page} не открылась"; exit 1; }
          done
          if grep -q "Traceback" server.log; then cat server.log; exit 1; fi

      - name: Лог сервера
        if: failure()
        run: cat server.log || true

  docker:
    name: Сборка Docker-образа
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: newsflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
