{% extends "base.html" %}
{% block title %}Ошибка {{ status_code }}{% endblock %}
{% block content %}
<div class="wrap">
  <div class="pane empty" style="margin-top:40px">
    <b>{% if status_code == 404 %}Такой страницы нет{% else %}Не получилось открыть страницу{% endif %}</b>
    <p>{{ message }}</p>
    <a class="btn btn--primary" href="/">Вернуться на радар</a>
  </div>
</div>
{% endblock %}
