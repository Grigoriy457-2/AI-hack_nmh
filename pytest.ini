[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = tests
pythonpath = . tests
addopts = -ra
markers =
    unit: чистые юнит-тесты (без HTTP)
    api: интеграционные тесты JSON API через httpx AsyncClient
    pipeline: тесты, прогоняющие полный пайплайн исследования (mock-провайдеры)
    e2e: сквозной демо-сценарий DoD (п.11 ТЗ)
    smoke: смоук HTML-страниц
filterwarnings =
    ignore::DeprecationWarning
