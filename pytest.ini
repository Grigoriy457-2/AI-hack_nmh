[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = tests
pythonpath = . tests
addopts = -ra
markers =
    unit: чистые юнит-тесты (без HTTP)
    api: интеграционные тесты JSON API через httpx AsyncClient
    pipeline: тесты, прогоняющие полный пайплайн исследования (mock-провайдеры)
    e2e: сквозной путь редактора v2 (ASGI и настоящий uvicorn)
    smoke: смоук HTML-страниц v2 (/login, /, /stories, /stories/{id}, /sources, /stats)
filterwarnings =
    ignore::DeprecationWarning
